name: Android APK

# Rebuild the APK on every app change so the release always matches the live app.
# The APK loads the live site, so web changes reach phones instantly; the in-app update
# prompt only appears when the native wrapper (android/) changes and versionCode rises.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'icon-*.png'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the native version
        run: echo "NATIVE_VERSION=$(( $(git rev-list --count HEAD -- android) + 1 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle -p android assembleRelease --no-daemon

      - name: Publish to the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk aesthetic-body.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest aesthetic-body.apk \
            --title "Aesthetic Body for Android v1.${NATIVE_VERSION} (build ${{ github.run_number }})" \
            --notes "Download aesthetic-body.apk on your Android phone and open it to install.

          The app loads the live site, so app changes appear without reinstalling. Installed apps check this release and offer an update when the Android wrapper changes.

          versionCode=${NATIVE_VERSION}
          Built from ${{ github.sha }}."

      - uses: actions/upload-artifact@v4
        with:
          name: aesthetic-body-apk
          path: aesthetic-body.apk
