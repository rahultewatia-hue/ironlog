<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aesthetic Body">
<meta name="theme-color" content="#eef0f5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Aesthetic Body</title>
<style>
:root{
  --bg:#eef0f5; --text:#1d2230; --muted:#7a8296; --line:rgba(29,34,48,.08);
  --gold:#d9a441; --goldtxt:#b07d1c; --green:#3f9a72; --red:#c0563f; --ink:#2a2f3d;
  --glass:rgba(255,255,255,.52); --glass-hi:rgba(255,255,255,.85);
  --font: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* soft colour fields the glass refracts */
.blobs{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.blobs span{position:absolute;border-radius:50%;filter:blur(50px);opacity:.75}
.blobs .b1{width:320px;height:320px;background:#ffd9a8;top:-80px;right:-90px}
.blobs .b2{width:280px;height:280px;background:#cfd8ff;top:34%;left:-120px}
.blobs .b3{width:260px;height:260px;background:#c9f0dd;bottom:-60px;right:-80px}

main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px calc(130px + env(safe-area-inset-bottom))}
.view{animation:in .3s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* liquid glass */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.7);border-radius:24px;
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(255,255,255,.25),0 10px 30px -12px rgba(40,50,90,.22),0 2px 6px -2px rgba(40,50,90,.08)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.25) 100%)}
.glass > *{position:relative}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px;min-height:42px}
.iconbtn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:0;color:var(--ink);font-size:22px;font-weight:700}
.eyebrow{font-size:14px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
h1{font-size:32px;line-height:1.05;letter-spacing:-.02em;margin:4px 0 12px;font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:99px;color:#4a5165}
.clock{font-weight:800;font-size:15px;padding:8px 14px;border-radius:99px;color:var(--goldtxt);font-variant-numeric:tabular-nums}
.label{font-size:15px;font-weight:700;margin:6px 4px 10px}
.perspective{perspective:900px}
.tilt{transform-style:preserve-3d;transition:transform .2s ease-out;will-change:transform}

/* hero */
.hero{padding:18px;display:flex;gap:14px;align-items:center;margin-bottom:16px}
.figs{display:flex;gap:3px;transform:translateZ(30px)}
.hero .info{flex:1;min-width:0;transform:translateZ(18px)}
.hero .big{font-size:17px;font-weight:700;margin:2px 0 10px;line-height:1.25}
.bar{height:8px;border-radius:9px;background:rgba(29,34,48,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#f0c56d,#d9a441);box-shadow:0 0 12px rgba(217,164,65,.5);transition:width .4s}
.plates3d{display:flex;align-items:center;gap:3px;position:absolute;right:16px;top:-24px;transform:rotate(-8deg) translateZ(40px)}
.plates3d span{border-radius:6px;box-shadow:inset -3px 0 4px rgba(0,0,0,.15),inset 2px 0 2px rgba(255,255,255,.6),0 6px 12px -4px rgba(0,0,0,.25)}
.gold{border:0;border-radius:16px;padding:14px 18px;font-weight:800;color:#3d2a06;background:linear-gradient(180deg,#f6d27e,#dea94a);
  box-shadow:0 8px 18px -8px rgba(217,164,65,.7),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(0,0,0,.08)}
.gold:active,.finish:active{transform:scale(.98)}
.gold.block{display:block;width:100%;margin-top:4px}

/* exercise / day rows */
.ex{display:flex;gap:12px;align-items:center;padding:10px 12px 10px 10px;margin-bottom:10px;width:100%;text-align:left;transition:transform .15s}
button.ex{border:1px solid rgba(255,255,255,.7)}
.ex:active{transform:scale(.98)}
.thumb{width:56px;height:68px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(235,238,246,.7));box-shadow:inset 0 1px 0 #fff,0 4px 10px -4px rgba(40,50,90,.25)}
.ex .txt{flex:1;min-width:0}
.ex .name{font-size:15.5px;font-weight:700}
.ex .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.ex .next{font-size:12.5px;color:var(--goldtxt);font-weight:600;margin-top:2px}
.ex.up{box-shadow:inset 0 1px 0 var(--glass-hi),0 0 0 1.5px rgba(217,164,65,.55),0 12px 30px -12px rgba(217,164,65,.45)}
.done{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;flex:none;
  background:radial-gradient(circle at 35% 30%,#8fd4b3,#4f9f7c);box-shadow:0 4px 10px -3px rgba(79,159,124,.6),inset 0 1px 1px rgba(255,255,255,.6)}
.chev{color:#a3aabb;font-size:22px;font-weight:700}
.daytag{font-size:12px;font-weight:800;color:var(--goldtxt)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tile{padding:12px;border-radius:20px}
.tile b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile span{font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.25;display:block;margin-top:2px}
.good{color:var(--green)!important}.bad{color:var(--red)!important}

/* finisher, effort */
.card{padding:14px 16px;margin-bottom:12px}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:28px;height:28px;border-radius:9px;flex:none;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.6);box-shadow:inset 0 2px 4px rgba(40,50,90,.1);
  display:flex;align-items:center;justify-content:center;color:transparent;font-weight:900}
.check input:checked + .box{background:radial-gradient(circle at 35% 30%,#8fd4b3,#4f9f7c);color:#fff;border-color:transparent;box-shadow:0 4px 10px -3px rgba(79,159,124,.6)}
.check input:focus-visible + .box{outline:2px solid var(--gold);outline-offset:2px}
.check b{display:block;font-size:15.5px}
.check small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:16px;margin-bottom:12px}
.seg button{position:relative;z-index:1;border:0;background:none;font-size:13.5px;font-weight:700;color:var(--muted);padding:9px 0;transition:color .2s}
.seg button.on{color:var(--text)}
.seg .lens{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:12px;
  background:rgba(255,255,255,.85);box-shadow:0 4px 14px -4px rgba(40,50,90,.3),inset 0 1px 0 #fff;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.card .seg{margin:8px 0 0;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.6)}
.note{color:var(--muted);font-size:12.5px;margin-top:8px}
.finish{display:block;width:100%;margin-top:6px;border:0;border-radius:20px;padding:17px;font-size:17px;font-weight:800;color:#3d2a06;
  background:linear-gradient(180deg,#f6d27e,#dea94a);box-shadow:0 12px 24px -10px rgba(217,164,65,.7),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(0,0,0,.08)}
.ghost{display:block;width:100%;background:none;border:0;color:var(--muted);padding:14px;margin-top:4px;font-weight:600}

/* exercise detail */
.log{padding:14px 14px 12px;margin:4px 0 14px}
.loghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lasttime{font-size:12.5px;color:var(--muted);font-weight:600;margin:4px 0 2px}
.tip{font-size:12.5px;font-weight:700;color:var(--goldtxt);margin:2px 0}
.sgrid{display:grid;grid-template-columns:24px 1fr 1fr 52px;gap:8px;align-items:center}
.sgrid.h{font-size:11.5px;font-weight:700;color:var(--muted);margin:10px 0 6px;text-align:center}
.srow{margin-bottom:8px}
.srow .n{text-align:center;font-weight:800;color:#a3aabb}
.srow input{width:100%;min-width:0;font-size:19px;font-weight:800;text-align:center;padding:11px 4px;border-radius:14px;border:1px solid rgba(255,255,255,.85);
  background:rgba(255,255,255,.62);box-shadow:inset 0 2px 5px rgba(40,50,90,.08);color:var(--text);outline:none;transition:background .2s,box-shadow .2s;font-variant-numeric:tabular-nums}
.srow input:focus{border-color:rgba(217,164,65,.8);box-shadow:0 0 0 3px rgba(217,164,65,.22)}
.srow input::placeholder{color:#b3b9c6;font-weight:700}
.tick{height:47px;border-radius:14px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.55);font-size:19px;font-weight:900;color:#a3aabb;
  box-shadow:0 3px 8px -3px rgba(40,50,90,.22),inset 0 1px 0 #fff;transition:transform .12s}
.tick:active{transform:scale(.94)}
.srow.ok .tick{background:radial-gradient(circle at 35% 30%,#8fd4b3,#4f9f7c);color:#fff;border-color:transparent;box-shadow:0 6px 14px -4px rgba(79,159,124,.6),inset 0 1px 1px rgba(255,255,255,.6)}
.srow.ok input{background:rgba(214,240,227,.75);color:#2f6e53}
.addset{border:0;background:none;font-weight:800;color:var(--goldtxt);padding:4px 0}
.plates{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-top:6px;min-height:24px}
.pl{min-width:28px;height:22px;padding:0 6px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:#2a2f3d;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.75),inset 0 -2px 3px rgba(0,0,0,.12),0 2px 5px -2px rgba(0,0,0,.25)}
.mapcard{padding:16px;display:flex;gap:10px;align-items:center;margin-bottom:14px}
.legend{font-size:12.5px;font-weight:600;flex:1;min-width:0;transform:translateZ(16px)}
.legend div{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.sw{width:12px;height:12px;border-radius:4px;flex:none}
.sw.p{background:radial-gradient(circle at 35% 30%,#ffe2a3,#d9a441)}
.sw.s{background:radial-gradient(circle at 35% 30%,#fff4dc,#e2c287)}
.sw.n{background:radial-gradient(circle at 35% 30%,#fff,#c3c9d6)}
.stat{font-size:12px;color:var(--muted);margin-top:10px}
.stat b{display:block;font-size:19px;color:var(--text);font-weight:800}
.chart{padding:14px 12px 8px;margin-bottom:16px}
.chart svg{width:100%;display:block}
.ctitle{font-size:14px;font-weight:700;margin:0 4px 6px}
.legend2{display:flex;gap:14px;font-size:11.5px;font-weight:600;color:var(--muted);margin:2px 4px}
.legend2 i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.sess{display:flex;overflow:hidden;margin-bottom:10px}
.date{width:70px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#8a6a2c;
  background:linear-gradient(160deg,rgba(255,236,200,.9),rgba(246,214,155,.6));border-right:1px solid rgba(255,255,255,.7)}
.date b{font-size:22px;color:#5a4212;line-height:1}
.tbl{flex:1;display:grid;align-items:center;padding:10px 12px;row-gap:4px;column-gap:4px;overflow-x:auto}
.tbl span{font-size:11.5px;color:var(--muted);font-weight:600}
.tbl b{font-size:17px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.tbl b.pr{color:var(--goldtxt)}

/* weight */
.logw{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;margin-bottom:14px;border-radius:22px}
.logw input{flex:1;min-width:0;border:0;background:none;font-size:30px;font-weight:800;color:var(--text);outline:none;font-variant-numeric:tabular-nums}
.logw input::placeholder{color:#b3b9c6}
.logw .kg{font-weight:700;color:var(--muted)}
.listcard{padding:4px 14px;margin-bottom:16px}
.li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li span{flex:1;color:var(--muted);font-weight:600;font-size:14px}
.li b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.li .x{border:0;background:none;color:#a3aabb;font-size:15px;padding:4px 6px}
.chg{font-size:12px;font-weight:700;min-width:44px;text-align:right;flex:none!important}
.empty{color:var(--muted);font-size:14px;padding:12px 2px;margin:0}

/* progress */
.bars3d{display:flex;align-items:flex-end;gap:8px;height:170px;padding:22px 4px 0}
.bars3d .bw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.bars3d .bv{font-size:10.5px;font-weight:700;color:var(--muted)}
.bars3d .b{width:100%;border-radius:10px 10px 6px 6px;background:linear-gradient(90deg,#d5dae4,#eef1f6 45%,#c9cfdb);box-shadow:inset 0 1px 0 #fff,0 6px 12px -6px rgba(40,50,90,.35);transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.9,.3,1.2) both}
.bars3d .b.now{background:linear-gradient(90deg,#e0a843,#f7d78d 45%,#c98f2c);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 16px -6px rgba(217,164,65,.7)}
.bars3d .bl{font-size:10.5px;font-weight:600;color:var(--muted);height:13px;white-space:nowrap}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.select{width:100%;margin:0 0 8px;padding:11px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.6);font-weight:700;color:var(--text);
  box-shadow:inset 0 2px 4px rgba(40,50,90,.07);-webkit-appearance:none;appearance:none}
.pr{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.medal{grid-row:span 2;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  background:radial-gradient(circle at 35% 30%,#fff1c9,#e5b04f);box-shadow:0 4px 10px -3px rgba(217,164,65,.6),inset 0 1px 1px #fff}
.pr b{font-size:14.5px}.pr .v{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.pr small{font-size:12px;color:var(--muted);font-weight:600}

/* history */
details.hs{margin-bottom:10px;padding:0 14px;border-radius:22px}
details.hs summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer}
details.hs summary::-webkit-details-marker{display:none}
.dchip{width:46px;height:50px;border-radius:14px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#8a6a2c;
  background:linear-gradient(160deg,rgba(255,236,200,.95),rgba(246,214,155,.65));box-shadow:inset 0 1px 0 #fff}
.dchip b{font-size:18px;color:#5a4212;line-height:1}
details.hs .t{flex:1;min-width:0}
details.hs .t b{display:block;font-size:15.5px}
details.hs .t small{font-size:12px;color:var(--muted);font-weight:600}
details.hs .k{font-weight:800;text-align:right;font-size:16px}
details.hs .k small{display:block;font-size:11px;color:var(--muted);font-weight:600}
details.hs[open] summary{border-bottom:1px solid var(--line)}
.sx{padding:6px 0 12px}
.sx p{margin:8px 0;font-size:14px;font-weight:700}
.sx p span{display:block;color:var(--muted);font-weight:600;font-size:13px;margin-top:1px}

/* settings */
.field{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.fin{display:flex;align-items:center;gap:6px}
.fin input{width:78px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.6);border-radius:12px;padding:9px 10px;font-weight:800;text-align:right;color:var(--text);box-shadow:inset 0 2px 4px rgba(40,50,90,.07);outline:none}
.fin input:focus{border-color:rgba(217,164,65,.8)}
.fin small{color:var(--muted);font-weight:600;width:26px}
.fhelp{font-size:12.5px;color:var(--muted);font-weight:600;padding:10px 0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.prose p{font-size:14px;color:#4a5165;line-height:1.5;margin:10px 0}
.btn2{display:flex;gap:8px}
.soft{flex:1;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.65);border-radius:14px;padding:13px;font-weight:700;color:var(--text);box-shadow:0 3px 8px -4px rgba(40,50,90,.25)}
.danger{display:inline-block;margin:10px 0;border:1px solid rgba(192,86,63,.3);background:rgba(255,255,255,.5);color:var(--red);border-radius:14px;padding:10px 14px;font-weight:700}

/* rest timer, toast, tab bar */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:11;width:min(524px,calc(100% - 28px));
  display:none;align-items:center;gap:10px;padding:10px 12px 12px 18px;border-radius:24px;overflow:hidden}
.rest.on{display:flex}
.rest b{font-size:24px;font-weight:800;min-width:66px;font-variant-numeric:tabular-nums}
.rest span{flex:1;font-size:14px;font-weight:700;color:var(--muted)}
.rest button{border:0;font-weight:800;font-size:13.5px;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.8);color:var(--text);box-shadow:0 2px 6px -2px rgba(40,50,90,.25)}
.rest .rbar{position:absolute!important;left:0;bottom:0;height:4px;background:linear-gradient(90deg,#f0c56d,#d9a441);transition:width .25s linear}
.rest.go{background:rgba(198,238,218,.78)}
.rest.go b{color:#2f7a58}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-160px);z-index:20;padding:12px 18px;border-radius:18px;font-size:14px;font-weight:700;
  max-width:90%;text-align:center;transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.toast.on{transform:translate(-50%,0)}
nav.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:10;width:min(524px,calc(100% - 28px));
  display:flex;justify-content:space-around;padding:8px;border-radius:30px}
nav.tabbar button{flex:1;border:0;background:none;font-size:10.5px;font-weight:700;color:#7a8296;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:22px}
nav.tabbar button.on{color:var(--text);background:rgba(255,255,255,.75);box-shadow:inset 0 1px 0 #fff,0 4px 12px -4px rgba(40,50,90,.25)}
nav.tabbar svg{width:23px;height:23px}
@media (prefers-reduced-motion:reduce){.view,.bars3d .b{animation:none}.toast,.seg .lens,.tilt{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gP" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#ffe2a3"/><stop offset=".5" stop-color="#e3a43a"/><stop offset="1" stop-color="#a8721c"/></radialGradient>
    <radialGradient id="gS" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#fff4dc"/><stop offset=".6" stop-color="#f1d6a0"/><stop offset="1" stop-color="#d7b475"/></radialGradient>
    <radialGradient id="gN" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#f7f8fb"/><stop offset=".6" stop-color="#cdd3de"/><stop offset="1" stop-color="#a9b1c1"/></radialGradient>
    <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e3e7ef"/><stop offset="1" stop-color="#aab2c2"/></linearGradient>
    <radialGradient id="gFloor" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="rgba(40,50,90,.28)"/><stop offset="1" stop-color="rgba(40,50,90,0)"/></radialGradient>
    <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5ad48" stop-opacity=".35"/><stop offset="1" stop-color="#e5ad48" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#28325a" flood-opacity=".22"/></filter>
  </defs>
</svg>
<div class="blobs" aria-hidden="true"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>
<main id="main"></main>
<div class="rest glass" id="rest" role="status"><b class="rt">0:00</b><span class="rl">Rest</span><button data-rest="30">+30s</button><button data-rest="skip">Skip</button><i class="rbar"></i></div>
<div class="toast glass" id="toast" role="status"></div>
<nav class="tabbar glass">
  <button data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>Workout</button>
  <button data-tab="weight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9.5a4 4 0 0 1 6 0M12 12l1.5-2.5"/></svg>Weight</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-4 3 3 6-7"/></svg>Progress</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>History</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg>Settings</button>
</nav>

<script>
"use strict";
/* ---------- Program (Rahul's split) ---------- */
// [name, sets, c=compound|i=isolation, bb=barbell|ez=EZ bar|db=dumbbell]
const PROGRAM = {
  chest:{name:'Chest + Triceps', wd:1, fin:'6 min: alternate 30s push-ups and 30s burpees', ex:[
    ['Barbell bench press',3,'c','bb'],['Incline barbell press',3,'c','bb'],['Decline dumbbell press',2,'c','db'],
    ['Close-grip bench press',3,'c','bb'],['EZ-bar skull crusher',2,'i','ez']]},
  legs:{name:'Legs', wd:2, fin:'6 rounds: 20s jump squats, 40s rest', ex:[
    ['Barbell back squat',3,'c','bb'],['Romanian deadlift',3,'c','bb'],['Bulgarian split squat',2,'c','db'],
    ['Barbell hip thrust',2,'c','bb']]},
  back:{name:'Back + Biceps', wd:4, fin:'6 min: alternate 30s renegade rows and 30s mountain climbers', ex:[
    ['Conventional deadlift',3,'c','bb'],['Barbell bent-over row',3,'c','bb'],['Single-arm dumbbell row',2,'c','db'],
    ['EZ-bar curl',3,'i','ez'],['Dumbbell hammer curl',2,'i','db']]},
  shoulders:{name:'Shoulders', wd:5, fin:'6 rounds: 20s light dumbbell thrusters, 40s rest', ex:[
    ['Standing overhead press',3,'c','bb'],['Seated dumbbell press',3,'c','db'],['Dumbbell lateral raise',3,'i','db'],
    ['Rear-delt fly',2,'i','db'],['Barbell shrug',2,'i','bb']]}
};
// Muscles each exercise works: [primary, secondary]
const MUSCLES = {
  'Barbell bench press':[['chest'],['delts','triceps']],
  'Incline barbell press':[['chest','delts'],['triceps']],
  'Decline dumbbell press':[['chest'],['triceps']],
  'Close-grip bench press':[['triceps'],['chest','delts']],
  'EZ-bar skull crusher':[['triceps'],[]],
  'Barbell back squat':[['quads','glutes'],['hams','lowback']],
  'Romanian deadlift':[['hams','glutes'],['lowback']],
  'Bulgarian split squat':[['quads','glutes'],['hams']],
  'Barbell hip thrust':[['glutes'],['hams']],
  'Conventional deadlift':[['hams','glutes','lowback'],['traps','quads','lats','fore']],
  'Barbell bent-over row':[['lats'],['rdelts','biceps','traps']],
  'Single-arm dumbbell row':[['lats'],['biceps','rdelts']],
  'EZ-bar curl':[['biceps'],['fore']],
  'Dumbbell hammer curl':[['biceps','fore'],[]],
  'Standing overhead press':[['delts'],['triceps','traps']],
  'Seated dumbbell press':[['delts'],['triceps']],
  'Dumbbell lateral raise':[['delts'],['traps']],
  'Rear-delt fly':[['rdelts'],['traps']],
  'Barbell shrug':[['traps'],['fore']]
};
const MNAME={chest:'chest',delts:'shoulders',triceps:'triceps',biceps:'biceps',lats:'lats',traps:'traps',rdelts:'rear delts',quads:'quads',hams:'hamstrings',glutes:'glutes',abs:'abs',fore:'forearms',lowback:'lower back',calves:'calves'};
const BACK=['triceps','lats','traps','rdelts','glutes','hams','lowback'];
const EX = {}; for(const p of Object.values(PROGRAM)) for(const e of p.ex){const m=MUSCLES[e[0]]||[[],[]];EX[e[0]]={sets:e[1],type:e[2],eq:e[3],p:m[0],s:m[1]}}
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
// Net MET (MET − 1) so the number is calories burned by training, not resting metabolism
const EFFORT=[{k:'mod',label:'Moderate',met:3.5},{k:'hard',label:'Hard',met:5},{k:'max',label:'All-out',met:6}];
const FIN_MET=8;
// Your plates, per side (pairs split across both sides of the bar)
const PLATES_PER_SIDE=[[15,1],[10,1],[5,2],[3,2],[2.5,1],[2,2],[1,1]];
const PLATE_COLOR={15:'#f2c45f',10:'#7cc9a2',5:'#ffffff',3:'#8db1ff',2.5:'#f08f8f',2:'#bcd3ff',1:'#d3d8e2'};

/* ---------- Storage ---------- */
const KEY='ironlog-v1';
function blank(){return {sessions:[],weights:[],active:null,settings:{restC:150,restI:90,bar:20,ez:10}}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.sessions)){d.settings=Object.assign(blank().settings,d.settings||{});d.weights=d.weights||[];return d}}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Could not save — storage is full or blocked')}}
let db=load();
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const z=n=>String(n).padStart(2,'0');
const dstr=(d=new Date())=>`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return dstr(d)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n==null?'':(Math.round(n*100)/100).toString();
const signed=n=>(n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(1);
const toDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const shortDate=s=>toDate(s).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const mmss=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${z(m)}:${z(x)}`:`${m}:${z(x)}`};
const e1rm=(w,r)=>r===1?w:w*(1+r/30);
const parseNum=v=>{v=String(v).trim().replace(',','.');if(v==='')return null;const n=parseFloat(v);return isFinite(n)?n:null};
const andList=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function weekStart(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function sortedWeights(){return [...db.weights].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function upsertWeight(date,kg){const i=db.weights.findIndex(w=>w.date===date);if(i>=0)db.weights[i].kg=kg;else db.weights.push({date,kg});save()}
function lastSets(name){for(let i=db.sessions.length-1;i>=0;i--){const s=db.sessions[i].sets[name];if(s&&s.length)return s}return null}
function calcKcal(min,bw,effort,fin){const met=(EFFORT.find(e=>e.k===effort)||EFFORT[1]).met;const fm=fin?Math.min(6,min):0;return Math.round((met-1)*bw*(min-fm)/60+(FIN_MET-1)*bw*fm/60)}
function dayMuscles(k){const p=new Set(),s=new Set();for(const e of PROGRAM[k].ex){EX[e[0]].p.forEach(m=>p.add(m));EX[e[0]].s.forEach(m=>s.add(m))}p.forEach(m=>s.delete(m));return {p:[...p],s:[...s]}}

/* ---------- 3D muscle map ---------- */
function figure(side,prim,sec,w){
  const f=k=>prim.includes(k)?'url(#gP)':sec.includes(k)?'url(#gS)':'url(#gN)';
  const st='stroke="rgba(255,255,255,.9)" stroke-width=".8"';
  let s=`<svg viewBox="0 0 100 196" width="${w}" height="${Math.round(w*1.96)}" aria-hidden="true">
  <ellipse cx="50" cy="188" rx="26" ry="5" fill="url(#gFloor)"/><g filter="url(#soft)">
  <circle cx="50" cy="15" r="10.5" fill="url(#gBody)"/><rect x="44.5" y="24" width="11" height="8" rx="3" fill="url(#gBody)"/>
  <path d="M32 33 Q50 28 68 33 L73 47 L66 94 L34 94 L27 47Z" fill="url(#gBody)"/>
  <path d="M25 36 Q17 62 16 96 L25 97 Q28 68 35 45Z" fill="url(#gBody)"/><path d="M75 36 Q83 62 84 96 L75 97 Q72 68 65 45Z" fill="url(#gBody)"/>
  <path d="M36 92 L49.5 94 L48.5 182 L40 182 Q32 132 36 92Z" fill="url(#gBody)"/><path d="M64 92 L50.5 94 L51.5 182 L60 182 Q68 132 64 92Z" fill="url(#gBody)"/>`;
  if(side==='f'){
    s+=`<ellipse cx="30.5" cy="40" rx="8" ry="7.5" fill="${f('delts')}" ${st}/><ellipse cx="69.5" cy="40" rx="8" ry="7.5" fill="${f('delts')}" ${st}/>
    <path d="M49.3 34 L37 34.5 Q30.5 44 36 55 L49.3 56Z" fill="${f('chest')}" ${st}/><path d="M50.7 34 L63 34.5 Q69.5 44 64 55 L50.7 56Z" fill="${f('chest')}" ${st}/>
    <rect x="40.5" y="58" width="19" height="33" rx="6" fill="${f('abs')}" ${st}/>
    <ellipse cx="24.5" cy="59" rx="5" ry="11" fill="${f('biceps')}" ${st}/><ellipse cx="75.5" cy="59" rx="5" ry="11" fill="${f('biceps')}" ${st}/>
    <ellipse cx="20.5" cy="83" rx="4" ry="11" fill="${f('fore')}" ${st}/><ellipse cx="79.5" cy="83" rx="4" ry="11" fill="${f('fore')}" ${st}/>
    <path d="M39 96 L49 97 L48 142 L40.5 142 Q35 118 39 96Z" fill="${f('quads')}" ${st}/><path d="M61 96 L51 97 L52 142 L59.5 142 Q65 118 61 96Z" fill="${f('quads')}" ${st}/>
    <ellipse cx="43" cy="163" rx="4.2" ry="15" fill="${f('calves')}" ${st}/><ellipse cx="57" cy="163" rx="4.2" ry="15" fill="${f('calves')}" ${st}/>`;
  }else{
    s+=`<path d="M40 30 L60 30 L67 38 L50 47 L33 38Z" fill="${f('traps')}" ${st}/>
    <ellipse cx="30.5" cy="40" rx="8" ry="7.5" fill="${f('rdelts')}" ${st}/><ellipse cx="69.5" cy="40" rx="8" ry="7.5" fill="${f('rdelts')}" ${st}/>
    <path d="M36.5 48 L49.3 50 L49.3 80 L41 77 Q33.5 61 36.5 48Z" fill="${f('lats')}" ${st}/><path d="M63.5 48 L50.7 50 L50.7 80 L59 77 Q66.5 61 63.5 48Z" fill="${f('lats')}" ${st}/>
    <ellipse cx="24.5" cy="59" rx="5" ry="11" fill="${f('triceps')}" ${st}/><ellipse cx="75.5" cy="59" rx="5" ry="11" fill="${f('triceps')}" ${st}/>
    <ellipse cx="20.5" cy="83" rx="4" ry="11" fill="${f('fore')}" ${st}/><ellipse cx="79.5" cy="83" rx="4" ry="11" fill="${f('fore')}" ${st}/>
    <rect x="42" y="80.5" width="16" height="10" rx="3.5" fill="${f('lowback')}" ${st}/>
    <ellipse cx="43.5" cy="101" rx="7" ry="9" fill="${f('glutes')}" ${st}/><ellipse cx="56.5" cy="101" rx="7" ry="9" fill="${f('glutes')}" ${st}/>
    <path d="M38 112 L49 112 L48 144 L40 144Z" fill="${f('hams')}" ${st}/><path d="M62 112 L51 112 L52 144 L60 144Z" fill="${f('hams')}" ${st}/>
    <ellipse cx="43" cy="163" rx="4.5" ry="15" fill="${f('calves')}" ${st}/><ellipse cx="57" cy="163" rx="4.5" ry="15" fill="${f('calves')}" ${st}/>`;
  }
  return s+'</g></svg>';
}
const pair=(p,s,w)=>figure('f',p,s,w)+figure('b',p,s,w);
const thumb=(p,s)=>`<div class="thumb">${figure(p.some(m=>BACK.includes(m))?'b':'f',p,s,33)}</div>`;

/* plate solver: fewest plates per side for each reachable load */
const PLATE_MAP=(()=>{const map=new Map();
  function go(i,sum,list){
    if(i===PLATES_PER_SIDE.length){const k=Math.round(sum*10)/10,cur=map.get(k);if(!cur||list.length<cur.length)map.set(k,list);return}
    const [p,c]=PLATES_PER_SIDE[i];
    for(let n=0;n<=c;n++)go(i+1,sum+p*n,list.concat(Array(n).fill(p)));
  }
  go(0,0,[]);return map})();
function solvePlates(total,bar){
  const side=Math.round((total-bar)/2*10)/10;
  if(side<0) return {err:`Below the ${fmt(bar)} kg bar`};
  if(PLATE_MAP.has(side)) return {plates:PLATE_MAP.get(side),side};
  let best=null;for(const k of PLATE_MAP.keys()) if(k<=side&&(best==null||k>best)) best=k;
  return {plates:PLATE_MAP.get(best)||[],side:best,closest:bar+best*2};
}
const chip=p=>`<span class="pl" style="background:${PLATE_COLOR[p]}">${fmt(p)}</span>`;
function platesHTML(name,w){
  const eq=EX[name].eq;if(eq==='db'||w==null) return '';
  const bar=eq==='ez'?db.settings.ez:db.settings.bar;
  const r=solvePlates(w,bar);
  if(r.err) return `<span>${esc(r.err)}</span>`;
  if(!r.plates.length) return `<span>Empty bar</span>`;
  return `<span>Each side</span>${r.plates.map(chip).join('')}${r.closest!=null?`<span>closest you can load: ${fmt(r.closest)} kg</span>`:''}`;
}

/* ---------- Toast & sound ---------- */
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2600)}
let actx;function unlockAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){try{if(!actx)return;[0,.22,.44].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=t>.4?1320:880;o.connect(g);g.connect(actx.destination);const s=actx.currentTime+t;g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.4,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.18);o.start(s);o.stop(s+.2)})}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200])}

/* ---------- Rest timer ---------- */
let rest=null;// {end,total,done}
function startRest(sec){rest={end:Date.now()+sec*1000,total:sec,done:false};tickClock()}
$('#rest').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!rest)return;if(b.dataset.rest==='skip'){rest=null}else{rest.end+=30000;rest.total+=30;rest.done=false}tickClock()});
function tickClock(){
  const c=$('#clock');
  if(c&&db.active)c.textContent=mmss((Date.now()-db.active.start)/1000);
  const r=$('#rest');
  if(!rest){r.classList.remove('on','go');return}
  const left=(rest.end-Date.now())/1000;
  r.classList.add('on');
  if(left<=0){
    if(!rest.done){rest.done=true;beep();setTimeout(()=>{if(rest&&rest.done){rest=null;tickClock()}},4000)}
    r.classList.add('go');r.querySelector('.rt').textContent='Go';r.querySelector('.rl').textContent='Next set';r.querySelector('.rbar').style.width='100%';
  }else{
    r.classList.remove('go');r.querySelector('.rt').textContent=mmss(left);r.querySelector('.rl').textContent='Rest';
    r.querySelector('.rbar').style.width=(100-left/rest.total*100)+'%';
  }
}
setInterval(tickClock,500);

/* ---------- Navigation ---------- */
let tab='workout',curEx=null,progEx=null,exMode='w';
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;curEx=null;render();window.scrollTo(0,0)});
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const m=$('#main');
  if(tab==='workout'&&curEx&&db.active&&db.active.sets[curEx])rDetail(m);
  else ({workout:rWorkout,weight:rWeight,progress:rProgress,history:rHistory,more:rMore})[tab](m);
  m.firstElementChild&&m.firstElementChild.classList.add('view');
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)m.querySelectorAll('.tilt').forEach(tilt);
  tickClock();
}
function tilt(el){
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();const dx=(e.clientX-r.left)/r.width-.5,dy=(e.clientY-r.top)/r.height-.5;el.style.transform=`rotateY(${dx*12}deg) rotateX(${-dy*12}deg)`});
  const reset=()=>el.style.transform='';el.addEventListener('pointerleave',reset);el.addEventListener('pointerup',reset);el.addEventListener('pointercancel',reset);
}
const tileH=(v,l,c='')=>`<div class="tile glass"><b class="${c}">${v}</b><span>${l}</span></div>`;
const seg=(items,on,attr)=>{const i=Math.max(0,items.findIndex(x=>x[0]===on));return `<div class="seg glass"><div class="lens" style="transform:translateX(${i*100}%)"></div>${items.map(([k,l])=>`<button data-${attr}="${k}" class="${k===on?'on':''}">${l}</button>`).join('')}</div>`};

/* ---------- Workout ---------- */
function weekStats(){const ws=weekStart().getTime();const s=db.sessions.filter(x=>x.start>=ws);return {n:s.length,kcal:s.reduce((a,b)=>a+b.kcal,0)}}
const plates3d=`<div class="plates3d" aria-hidden="true"><span style="width:14px;height:56px;background:linear-gradient(90deg,#f6cf6e,#d9a441)"></span><span style="width:12px;height:46px;background:linear-gradient(90deg,#8fd4b3,#4f9f7c)"></span><span style="width:10px;height:36px;background:linear-gradient(90deg,#ffffff,#d9dde6)"></span></div>`;
function rWorkout(m){
  if(!db.active){
    const wd=new Date().getDay();
    const sug=Object.entries(PROGRAM).find(([,p])=>p.wd===wd);
    const ws=weekStats(),lw=sortedWeights().slice(-1)[0];
    let hero;
    if(sug){const dm=dayMuscles(sug[0]);
      hero=`<div class="perspective"><div class="hero glass tilt">${plates3d}<div class="figs">${pair(dm.p,dm.s,46)}</div>
        <div class="info"><div class="eyebrow" style="font-size:12.5px">Today you train</div><div class="big">${esc(cap(andList(dm.p.map(x=>MNAME[x]))))}</div>
        <button class="gold block" data-start="${sug[0]}">Start workout</button></div></div></div>`;
    }else hero=`<div class="hero glass"><div class="info"><div class="big">Rest day</div><div class="muted" style="font-size:14px">Go for a 30–45 minute walk. You can still start any workout below.</div></div></div>`;
    m.innerHTML=`<section>
    <div class="top"><div class="eyebrow">${DAYS[wd]}</div></div>
    <h1>${sug?esc(sug[1].name):'Rest day'}</h1>
    ${sug?`<div class="chips"><span class="chip glass">${sug[1].ex.length} exercises</span><span class="chip glass">6–8 reps</span><span class="chip glass">6-min finisher</span></div>`:''}
    ${hero}
    <div class="tiles">${tileH(ws.n,'workouts this week')}${tileH(ws.kcal,'kcal burned this week')}${tileH(lw?fmt(lw.kg):'—',lw?'kg body weight':'log your weight')}</div>
    <div class="label">Your split</div>
    ${Object.entries(PROGRAM).map(([k,p])=>{const dm=dayMuscles(k);return `<button class="ex glass" data-start="${k}">${thumb(dm.p,dm.s)}<div class="txt"><div class="daytag">${DAYS[p.wd]}</div><div class="name">${esc(p.name)}</div><div class="meta">${p.ex.length} exercises</div></div><span class="chev">›</span></button>`}).join('')}
    </section>`;
    return;
  }
  const a=db.active,p=PROGRAM[a.day],dm=dayMuscles(a.day);
  const names=p.ex.map(e=>e[0]);
  const isDone=n=>a.sets[n].length>0&&a.sets[n].every(s=>s.done);
  const doneN=names.filter(isDone).length,setsN=names.reduce((t,n)=>t+a.sets[n].filter(s=>s.done).length,0);
  const next=names.find(n=>!isDone(n));
  m.innerHTML=`<section>
    <div class="top"><div class="eyebrow">Started ${new Date(a.start).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</div><div class="clock glass" id="clock">0:00</div></div>

function drawExChart(){

function startSession(k){
  const p=PROGRAM[k];
  db.active={day:k,start:Date.now(),finisher:false,effort:'hard',sets:Object.fromEntries(p.ex.map(e=>[e[0],Array.from({length:e[1]},()=>({w:null,r:null,done:false}))]))};

  const row=btn.closest('.srow'),card=btn.closest('[data-ex]'),name=card.dataset.ex,j=+row.dataset.set;

function finish(){
  const a=db.active,done={};let n=0;

  let bw=(sortedWeights().slice(-1)[0]||{}).kg;

  db.sessions.push({id:end,date:dstr(new Date(a.start)),day:a.day,start:a.start,end,min,effort:a.effort,finisher:a.finisher,bw,kcal,sets:done});
  db.active=null;rest=null;curEx=null;save();render();window.scrollTo(0,0);
  toast(`Saved: ${min} min, about ${kcal} kcal`);
}

/* ---------- Charts (SVG, no libraries, works offline) ---------- */
function smoothChart(svg,vals,labels,o={}){
  if(!svg)return;
  if(vals.length<2){svg.innerHTML=`<text x="160" y="88" text-anchor="middle" font-size="13" fill="#8a91a3" font-weight="600">${esc(o.empty||'Not enough data yet')}</text>`;return}
  const ov=o.overlay,all=vals.concat((ov||[]).filter(v=>v!=null));let lo=Math.min(...all),hi=Math.max(...all);
  const pad=Math.max((hi-lo)*.15,.5);lo-=pad;hi+=pad;
  const L=36,R=312,T=10,B=144,x=i=>L+(R-L)*i/(vals.length-1),y=v=>B-(B-T)*(v-lo)/(hi-lo);
  let g='';for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3,yy=y(v);g+=`<line x1="${L}" x2="${R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="rgba(29,34,48,.07)"/><text x="0" y="${(yy+4).toFixed(1)}" font-size="10.5" fill="#8a91a3" font-weight="600">${v.toFixed(hi-lo<10?1:0)}</text>`}
  const path=a=>{let d='',st=false,pi=-1;a.forEach((v,i)=>{if(v==null)return;if(!st){d+=`M${x(i).toFixed(1)},${y(v).toFixed(1)}`;st=true}else{const xm=((x(pi)+x(i))/2).toFixed(1);d+=` C${xm},${y(a[pi]).toFixed(1)} ${xm},${y(v).toFixed(1)} ${x(i).toFixed(1)},${y(v).toFixed(1)}`}pi=i});return d};
  const main=ov||vals,d=path(main),li=main.length-1,lx=x(li),ly=y(main[li]);
  const dots=ov?vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="#c3c9d6"/>`).join(''):vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.8" fill="#e5ad48"/>`).join('');
  svg.innerHTML=`${g}<path d="${d} L${R},${B} L${L},${B}Z" fill="url(#gArea)"/>${dots}
    <path d="${d}" fill="none" stroke="#d9a441" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="9" fill="rgba(217,164,65,.18)"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="5" fill="url(#gP)" stroke="#fff" stroke-width="2"/>
    <text x="${L}" y="164" font-size="10.5" fill="#8a91a3" font-weight="600">${esc(labels[0])}</text><text x="${R}" y="164" font-size="10.5" fill="#8a91a3" font-weight="600" text-anchor="end">${esc(labels[labels.length-1])}</text>`;
}

/* ---------- Events ---------- */
const main=$('#main');
main.addEventListener('click',e=>{
  unlockAudio();
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.start){if(db.active){toast('Finish or discard the current workout first');return}startSession(t.dataset.start);return}
  if(t.dataset.open){curEx=t.dataset.open;render();window.scrollTo(0,0);return}
  if(t.id==='back'){curEx=null;render();window.scrollTo(0,0);return}
  if(t.hasAttribute('data-tick'))return tickSet(t);
  if(t.hasAttribute('data-add')){db.active.sets[curEx].push({w:null,r:null,done:false});save();render();return}
  if(t.dataset.mode){exMode=t.dataset.mode;const sg=t.parentNode,i=[...sg.querySelectorAll('button')].indexOf(t);sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));sg.querySelector('.lens').style.transform=`translateX(${i*100}%)`;drawExChart();return}
  if(t.dataset.effort){db.active.effort=t.dataset.effort;save();const sg=t.parentNode,i=[...sg.querySelectorAll('button')].indexOf(t);sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));sg.querySelector('.lens').style.transform=`translateX(${i*100}%)`;return}
  if(t.id==='finish')return finish();
  if(t.id==='discard'){if(confirm('Discard this workout? Logged sets will be lost.')){db.active=null;rest=null;curEx=null;save();render()}return}
  if(t.id==='wSave'){const v=parseNum($('#wIn').value);if(!v||v<20||v>350){toast('Enter your weight in kg, like 78.4');return}upsertWeight(dstr(),v);render();toast(`Logged ${fmt(v)} kg`);return}
  if(t.dataset.delw){if(confirm('Delete this weight entry?')){db.weights=db.weights.filter(w=>w.date!==t.dataset.delw);save();render()}return}
  if(t.dataset.dels){if(confirm('Delete this workout?')){db.sessions=db.sessions.filter(s=>String(s.id)!==t.dataset.dels);save();render()}return}
  if(t.id==='exp')return exportData();
  if(t.id==='imp')return $('#impFile').click();
  if(t.id==='reset'){if(confirm('Erase all workouts and weights? Export a backup first if you want to keep them.')&&confirm('This cannot be undone. Erase everything?')){db=blank();save();render();toast('All data erased')}return}
});
main.addEventListener('input',e=>{
  const i=e.target;
  if(i.dataset.f&&db.active){
    const card=i.closest('[data-ex]'),name=card.dataset.ex,j=+i.closest('.srow').dataset.set,s=db.active.sets[name][j];
    s[i.dataset.f]=i.dataset.f==='r'?(parseNum(i.value)==null?null:Math.round(parseNum(i.value))):parseNum(i.value);
    save();
    if(i.dataset.f==='w')card.querySelector('.plates').innerHTML=platesHTML(name,s.w);
  }
});
main.addEventListener('change',e=>{
  const i=e.target;
  if(i.id==='fin'){db.active.finisher=i.checked;save()}
  if(i.id==='exSel'){progEx=i.value;render()}
  if(i.dataset.setting){const k=i.dataset.setting,v=parseNum(i.value);if(v!=null&&v>=0){db.settings[k]=v;save();toast('Saved')}else i.value=db.settings[k]}
  if(i.id==='impFile'&&i.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.sessions))throw 0;if(confirm(`Replace current data with this backup (${d.sessions.length} workouts)?`)){d.settings=Object.assign(blank().settings,d.settings||{});d.weights=d.weights||[];db=d;save();render();toast('Backup restored')}}catch(err){toast('That file is not an Aesthetic Body backup')}};r.readAsText(i.files[0])}
});
main.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='wIn')$('#wSave').click()});

render();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
