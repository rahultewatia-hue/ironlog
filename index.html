<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aesthetic Body">
<meta name="theme-color" content="#0a0d0f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Aesthetic Body</title>
<style>
/* Fonts bundled locally (SIL OFL) so they work offline: Outfit for headings and big numbers, Plus Jakarta Sans for UI text */
@font-face{font-family:'Plus Jakarta Sans';src:url(fonts/plus-jakarta-sans.woff2) format('woff2');font-weight:400 800;font-display:swap}
@font-face{font-family:'Outfit';src:url(fonts/outfit.woff2) format('woff2');font-weight:500 800;font-display:swap}
:root{
  --bg:#0a0d0f; --surface:#161b1e; --surface2:#1f2529; --line:rgba(255,255,255,.07);
  --text:#f3f6f4; --muted:#8a949b; --dim:#5c666d; --lime:#c6f432; --lime-d:#9fcc14; --onlime:#0b0f05; --red:#ff6b5b; --ink:#f3f6f4;
  --glass:rgba(24,29,33,.66);
  --font: "Plus Jakarta Sans", ui-rounded, -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --display: "Outfit", "Plus Jakarta Sans", ui-rounded, -apple-system, system-ui, sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.005em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
h1,.big,.tile b,.clock,.rest b,.stat b,.logw input,.date b,.dchip b,.finish,.gold,.srow input,.tbl b,.k,.howto .num{font-family:var(--display)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* soft lime glow behind the glass */
.blobs{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.blobs span{position:absolute;border-radius:50%;filter:blur(70px)}
.blobs .b1{width:340px;height:340px;background:rgba(150,200,30,.22);top:-140px;right:-120px}
.blobs .b2{width:300px;height:300px;background:rgba(40,90,70,.28);top:40%;left:-170px}
.blobs .b3{width:280px;height:280px;background:rgba(120,170,20,.12);bottom:-120px;right:-100px}

main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(70px + env(safe-area-inset-top)) 18px calc(130px + env(safe-area-inset-bottom))}
.view{animation:in .3s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* dark liquid glass */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  border:1px solid rgba(255,255,255,.07);border-radius:22px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 14px 34px -16px rgba(0,0,0,.7)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 35%,rgba(255,255,255,0) 75%,rgba(198,244,50,.04) 100%)}
.glass > *{position:relative}

.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px;min-height:42px}
.iconbtn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:0;color:var(--text)}
.eyebrow{font-size:14px;font-weight:600;color:var(--muted)}
.muted{color:var(--muted)}
h1{font-size:32px;line-height:1.05;letter-spacing:-.02em;margin:4px 0 12px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:99px;color:#c9d1d5}
.chip .ic{width:15px;height:15px;color:var(--lime)}
.clock{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px;padding:8px 14px;border-radius:99px;color:var(--lime);font-variant-numeric:tabular-nums}
.clock .ic{width:16px;height:16px}
.label{display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:700;margin:8px 2px 12px;font-family:var(--display);letter-spacing:-.01em}
.label small{font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--lime)}
.perspective{perspective:900px}
.tilt{transform-style:preserve-3d;transition:transform .2s ease-out;will-change:transform}

/* hero */
.hero{padding:18px;display:flex;gap:14px;align-items:center;margin-bottom:16px;
  background:radial-gradient(120% 120% at 0% 0%,rgba(198,244,50,.10),rgba(24,29,33,.7) 55%)}
.figs{display:flex;gap:3px;transform:translateZ(30px)}
.hero .info{flex:1;min-width:0;transform:translateZ(18px)}
.hero .big{font-size:21px;font-weight:700;margin:6px 0 12px;line-height:1.15;letter-spacing:-.01em}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;color:var(--lime);background:rgba(198,244,50,.12);border:1px solid rgba(198,244,50,.25)}
.badge .ic{width:14px;height:14px}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--lime-d),var(--lime));box-shadow:0 0 14px rgba(198,244,50,.55);transition:width .4s}
.plates3d{display:flex;align-items:center;gap:3px;position:absolute;right:16px;top:-24px;transform:rotate(-8deg) translateZ(40px)}
.plates3d span{border-radius:6px;box-shadow:inset -3px 0 4px rgba(0,0,0,.35),inset 2px 0 2px rgba(255,255,255,.35),0 8px 16px -4px rgba(0,0,0,.6)}
.gold{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:99px;padding:12px 12px 12px 20px;font-weight:700;font-size:15.5px;color:var(--onlime);background:var(--lime);
  box-shadow:0 10px 26px -10px rgba(198,244,50,.65),inset 0 1px 0 rgba(255,255,255,.5)}
.gold .arr{width:28px;height:28px;border-radius:50%;background:var(--onlime);color:var(--lime);display:flex;align-items:center;justify-content:center}
.gold .arr .ic{width:16px;height:16px}
.gold:active,.finish:active{transform:scale(.98)}
.gold.block{display:flex;width:100%;margin-top:4px;justify-content:space-between}

/* exercise / day rows */
.ex{display:flex;gap:12px;align-items:center;padding:10px 12px 10px 10px;margin-bottom:10px;width:100%;text-align:left;transition:transform .15s;color:var(--text)}
button.ex{border:1px solid rgba(255,255,255,.07)}
.ex:active{transform:scale(.98)}
.thumb{width:56px;height:66px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#252c31,#14181b);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 14px -6px rgba(0,0,0,.7)}
.thumb.photo{position:relative;overflow:hidden;width:60px;height:72px;border:1px solid rgba(255,255,255,.08)}
.thumb.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb.photo::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 -18px 18px -14px rgba(0,0,0,.55);pointer-events:none}
.ex.up .thumb.photo{border-color:rgba(198,244,50,.55)}
.ex .txt{flex:1;min-width:0}
.ex .name{font-size:15.5px;font-weight:700}
.ex .meta{font-size:12.5px;color:var(--muted);margin-top:2px}
.ex .next{font-size:12.5px;color:var(--lime);font-weight:600;margin-top:2px}
.ex.up{border-color:rgba(198,244,50,.45)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px rgba(198,244,50,.35),0 14px 30px -14px rgba(198,244,50,.35)}
.done{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--onlime);flex:none;background:var(--lime);box-shadow:0 0 14px rgba(198,244,50,.45)}
.done .ic{width:17px;height:17px;stroke-width:3}
.chev{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted);background:rgba(255,255,255,.05)}
.chev .ic{width:17px;height:17px}
.daytag{font-size:12px;font-weight:700;color:var(--lime)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tile{padding:12px;border-radius:20px}
.tile .ic{width:18px;height:18px;color:var(--lime);margin-bottom:6px;display:block}
.tile b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile span{font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.25;display:block;margin-top:2px}
.good{color:var(--lime)!important}.bad{color:var(--red)!important}

/* finisher, effort */
.card{padding:14px 16px;margin-bottom:12px}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.box{width:28px;height:28px;border-radius:9px;flex:none;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;color:transparent}
.box .ic{width:17px;height:17px;stroke-width:3}
.check input:checked + .box{background:var(--lime);color:var(--onlime);border-color:transparent;box-shadow:0 0 14px rgba(198,244,50,.45)}
.check input:focus-visible + .box{outline:2px solid var(--lime);outline-offset:2px}
.check b{display:block;font-size:15.5px}
.check small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:99px;margin-bottom:12px}
.seg button{position:relative;z-index:1;border:0;background:none;font-size:13.5px;font-weight:700;color:var(--muted);padding:9px 0;transition:color .2s}
.seg button.on{color:var(--onlime)}
.seg .lens{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:99px;background:var(--lime);
  box-shadow:0 6px 16px -6px rgba(198,244,50,.6),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.card .seg{margin:8px 0 0;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.06)}
.note{color:var(--muted);font-size:12.5px;margin-top:8px}
.finish{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:6px;border:0;border-radius:99px;padding:17px;font-size:17px;font-weight:700;color:var(--onlime);background:var(--lime);
  box-shadow:0 14px 30px -12px rgba(198,244,50,.65),inset 0 1px 0 rgba(255,255,255,.5)}
.finish .ic{stroke-width:2.6}
.ghost{display:block;width:100%;background:none;border:0;color:var(--muted);padding:14px;margin-top:4px;font-weight:600}

/* exercise detail */
.log{padding:14px 14px 12px;margin:4px 0 14px}
.loghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lasttime{font-size:12.5px;color:var(--muted);font-weight:600;margin:4px 0 2px}
.tip{font-size:12.5px;font-weight:700;color:var(--lime);margin:2px 0}
.sgrid{display:grid;grid-template-columns:24px 1fr 1fr 52px;gap:8px;align-items:center}
.sgrid.h{font-size:11.5px;font-weight:700;color:var(--muted);margin:10px 0 6px;text-align:center}
.srow{margin-bottom:8px}
.srow .n{text-align:center;font-weight:700;color:var(--dim)}
.srow input{width:100%;min-width:0;font-size:19px;font-weight:700;text-align:center;padding:11px 4px;border-radius:14px;border:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.28);box-shadow:inset 0 2px 6px rgba(0,0,0,.35);color:var(--text);outline:none;transition:background .2s,box-shadow .2s;font-variant-numeric:tabular-nums}
.srow input:focus{border-color:rgba(198,244,50,.7);box-shadow:0 0 0 3px rgba(198,244,50,.18)}
.srow input::placeholder{color:#4d575e;font-weight:600}
.tick{height:47px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:var(--dim);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.tick .ic{width:20px;height:20px;stroke-width:3}
.tick:active{transform:scale(.94)}
.srow.ok .tick{background:var(--lime);color:var(--onlime);border-color:transparent;box-shadow:0 0 16px rgba(198,244,50,.45)}
.srow.ok input{background:rgba(198,244,50,.1);border-color:rgba(198,244,50,.25);color:#e7ffa6}
.addset{display:inline-flex;align-items:center;gap:6px;border:0;background:none;font-weight:700;color:var(--lime);padding:4px 0}
.addset .ic{width:16px;height:16px}
.plates{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-top:6px;min-height:24px}
.pl{min-width:28px;height:22px;padding:0 6px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:#15191c;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -2px 3px rgba(0,0,0,.2),0 2px 6px -2px rgba(0,0,0,.6)}
.mapcard{padding:16px;display:flex;gap:10px;align-items:center;margin-bottom:14px}
.legend{font-size:12.5px;font-weight:600;flex:1;min-width:0;transform:translateZ(16px);color:#c9d1d5}
.legend div{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.sw{width:12px;height:12px;border-radius:4px;flex:none}
.sw.p{background:radial-gradient(circle at 35% 30%,#efffb0,#c6f432 55%,#7fa313)}
.sw.s{background:radial-gradient(circle at 35% 30%,#7d8a46,#4a5428)}
.sw.n{background:radial-gradient(circle at 35% 30%,#4a535a,#262c31)}
.stat{font-size:12px;color:var(--muted);margin-top:10px}
.stat b{display:block;font-size:19px;color:var(--text);font-weight:700}
.chart{padding:14px 12px 8px;margin-bottom:16px}
.chart svg{width:100%;display:block}
.ctitle{font-size:14px;font-weight:700;margin:0 4px 6px}
.legend2{display:flex;gap:14px;font-size:11.5px;font-weight:600;color:var(--muted);margin:2px 4px}
.legend2 i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.sess{display:flex;overflow:hidden;margin-bottom:10px}
.date{width:70px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--lime);
  background:rgba(198,244,50,.08);border-right:1px solid rgba(255,255,255,.06)}
.date b{font-size:22px;color:var(--text);line-height:1}
.tbl{flex:1;display:grid;align-items:center;padding:10px 12px;row-gap:4px;column-gap:4px;overflow-x:auto}
.tbl span{font-size:11.5px;color:var(--muted);font-weight:600}
.tbl b{font-size:17px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.tbl b.pr{color:var(--lime)}

/* weight */
.logw{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 18px;margin-bottom:14px;border-radius:99px}
.logw input{flex:1;min-width:0;border:0;background:none;font-size:30px;font-weight:700;color:var(--text);outline:none;font-variant-numeric:tabular-nums}
.logw input::placeholder{color:#4d575e}
.logw .kg{font-weight:700;color:var(--muted)}
.listcard{padding:4px 14px;margin-bottom:16px}
.li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li span{flex:1;color:var(--muted);font-weight:600;font-size:14px}
.li b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.li .x{border:0;background:none;color:var(--dim);padding:4px 6px;display:flex}
.li .x .ic{width:16px;height:16px}
.chg{font-size:12px;font-weight:700;min-width:44px;text-align:right;flex:none!important}
.empty{color:var(--muted);font-size:14px;padding:12px 2px;margin:0}

/* progress */
.bars3d{display:flex;align-items:flex-end;gap:8px;height:170px;padding:22px 4px 0}
.bars3d .bw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.bars3d .bv{font-size:10.5px;font-weight:700;color:var(--muted)}
.bars3d .b{width:100%;border-radius:10px 10px 6px 6px;background:linear-gradient(90deg,#2a3135,#3a4247 45%,#22282c);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 16px -8px rgba(0,0,0,.8);transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.9,.3,1.2) both}
.bars3d .b.now{background:linear-gradient(90deg,#9fcc14,#dcff6e 45%,#86ad0e);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 22px -4px rgba(198,244,50,.6)}
.bars3d .bl{font-size:10.5px;font-weight:600;color:var(--muted);height:13px;white-space:nowrap}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.select{width:100%;margin:0 0 8px;padding:11px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.28);font-weight:700;color:var(--text);-webkit-appearance:none;appearance:none}
.pr{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.medal{grid-row:span 2;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(198,244,50,.1);color:var(--lime);border:1px solid rgba(198,244,50,.2)}
.medal .ic{width:18px;height:18px}
.pr b{font-size:14.5px}.pr .v{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;font-family:var(--display);font-size:16px}
.pr small{font-size:12px;color:var(--muted);font-weight:600}

/* history */
details.hs{margin-bottom:10px;padding:0 14px;border-radius:20px}
details.hs summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer}
details.hs summary::-webkit-details-marker{display:none}
.dchip{width:46px;height:50px;border-radius:14px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--lime);background:rgba(198,244,50,.08);border:1px solid rgba(198,244,50,.15)}
.dchip b{font-size:18px;color:var(--text);line-height:1}
details.hs .t{flex:1;min-width:0}
details.hs .t b{display:block;font-size:15.5px}
details.hs .t small{font-size:12px;color:var(--muted);font-weight:600}
details.hs .k{display:flex;flex-direction:column;align-items:flex-end;font-weight:700;font-size:16px}
details.hs .k small{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:600;font-family:var(--font)}
details.hs .k .ic{width:12px;height:12px;color:#ff9a3c}
details.hs[open] summary{border-bottom:1px solid var(--line)}
.sx{padding:6px 0 12px}
.sx p{margin:8px 0;font-size:14px;font-weight:700}
.sx p span{display:block;color:var(--muted);font-weight:600;font-size:13px;margin-top:1px}

/* settings */
.field{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.fin{display:flex;align-items:center;gap:6px}
.fin input{width:78px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.28);border-radius:12px;padding:9px 10px;font-weight:700;text-align:right;color:var(--text);outline:none}
.fin input:focus{border-color:rgba(198,244,50,.7)}
.fin small{color:var(--muted);font-weight:600;width:26px}
.fhelp{font-size:12.5px;color:var(--muted);font-weight:600;padding:10px 0;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.prose p{font-size:14px;color:#b6bec3;line-height:1.55;margin:10px 0}
.btn2{display:flex;gap:8px}
.soft{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);border-radius:99px;padding:13px;font-weight:700;color:var(--text)}
.soft .ic{width:17px;height:17px;color:var(--lime)}
.danger{display:inline-flex;align-items:center;gap:6px;margin:10px 0;border:1px solid rgba(255,107,91,.3);background:rgba(255,107,91,.06);color:var(--red);border-radius:99px;padding:10px 14px;font-weight:700}
.danger .ic{width:16px;height:16px}

/* rest timer, toast, tab bar */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:11;width:min(524px,calc(100% - 28px));
  display:none;align-items:center;gap:10px;padding:10px 12px 12px 16px;border-radius:24px;overflow:hidden}
.rest.on{display:flex}
.rest .ic{color:var(--lime)}
.rest b{font-size:24px;font-weight:700;min-width:62px;font-variant-numeric:tabular-nums}
.rest span{flex:1;font-size:14px;font-weight:700;color:var(--muted)}
.rest button{border:0;font-weight:700;font-size:13.5px;padding:9px 13px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--text)}
.rest .rbar{position:absolute!important;left:0;bottom:0;height:3px;background:var(--lime);box-shadow:0 0 10px var(--lime);transition:width .25s linear}
.rest.go{background:rgba(198,244,50,.16);border-color:rgba(198,244,50,.4)}
.rest.go b{color:var(--lime)}
.toast{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translate(-50%,-160px);z-index:20;padding:12px 18px;border-radius:99px;font-size:14px;font-weight:700;
  max-width:90%;text-align:center;transition:transform .3s cubic-bezier(.3,1.3,.5,1)}
.toast.on{transform:translate(-50%,0)}
nav.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:10;width:min(524px,calc(100% - 24px));
  display:flex;justify-content:space-around;padding:8px 6px;border-radius:28px;background:rgba(14,18,20,.82)}
nav.tabbar button{flex:1;border:0;background:none;font-size:10.5px;font-weight:600;color:#6f797f;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0}
nav.tabbar button .ic{width:22px;height:22px;stroke-width:1.9}
nav.tabbar button.on{color:var(--lime)}
nav.tabbar button.on .ic{filter:drop-shadow(0 0 6px rgba(198,244,50,.6))}

/* exercise screen: demo on top half, info below */
body.focus nav.tabbar{display:none}
body.focus .rest{bottom:calc(14px + env(safe-area-inset-bottom))}
body.focus main{padding-top:calc(58px + env(safe-area-inset-top))}
/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:12;padding-top:env(safe-area-inset-top);background:rgba(10,13,15,.72);
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid rgba(255,255,255,.06)}
.tb-in{max-width:560px;margin:0 auto;height:56px;display:flex;align-items:center;gap:8px;padding:0 12px}
.tb-side{display:flex;gap:6px;min-width:84px}.tb-side.r{justify-content:flex-end}
.tb-title{flex:1;text-align:center;font-family:var(--display);font-weight:700;font-size:16.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);color:var(--text);display:flex;align-items:center;justify-content:center;transition:opacity .2s,background .2s}
.tbtn .ic{width:19px;height:19px}
.tbtn:active{background:rgba(198,244,50,.15)}
.tbtn:disabled{opacity:.3;cursor:default}
.tbtn.on{color:var(--lime);border-color:rgba(198,244,50,.35);background:rgba(198,244,50,.1)}
/* home */
.hello{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:19px;color:var(--onlime);
  background:radial-gradient(circle at 35% 30%,#efffb0,#c6f432 55%,#7fa313);box-shadow:0 0 0 3px rgba(198,244,50,.15),0 0 18px rgba(198,244,50,.35)}
.hello small{display:block;color:var(--muted);font-size:13.5px;font-weight:600}
.hello b{display:block;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em}
.plan{position:relative;overflow:hidden;border-radius:26px;min-height:230px;padding:18px;margin-bottom:16px;display:flex;flex-direction:column;justify-content:flex-end;
  border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 40px -20px rgba(0,0,0,.9)}
.plan .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.04)}
.plan .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,13,15,.95) 0%,rgba(10,13,15,.75) 45%,rgba(10,13,15,.15) 100%),linear-gradient(0deg,rgba(10,13,15,.7),transparent 50%)}
.plan > *:not(.bg){position:relative}
.plan h2{font-family:var(--display);font-size:27px;line-height:1.05;margin:10px 0 6px;font-weight:700;letter-spacing:-.02em;max-width:75%}
.plan p{margin:0 0 14px;color:#c3cbcf;font-size:13.5px;max-width:70%}
.plan .gold{align-self:flex-start}
.act{display:flex;gap:16px;align-items:center;padding:16px;margin-bottom:16px}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rv b{font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
.ring .rv span{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.alist{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.arow{display:flex;gap:10px;align-items:center;background:none;border:0;padding:0;text-align:left;color:var(--text)}
.arow .ic{width:20px;height:20px;color:var(--lime)}
.arow small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.arow b{font-family:var(--display);font-size:17px;font-weight:700}
.arow b span{font-family:var(--font);font-size:12px;color:var(--muted);font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px;margin-bottom:16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted)}
.wd i{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);font-style:normal;color:var(--dim)}
.wd i .ic{width:15px;height:15px;stroke-width:3}
.wd.sched i{border-color:rgba(198,244,50,.35)}
.wd.done i{background:var(--lime);color:var(--onlime);border-color:transparent;box-shadow:0 0 12px rgba(198,244,50,.45)}
.wd.today{color:var(--text)}
.wd.today i{outline:2px solid rgba(255,255,255,.5);outline-offset:2px}
.qw{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px 16px;padding:2px 18px 6px;scrollbar-width:none}
.qw::-webkit-scrollbar{display:none}
.qcard{position:relative;flex:none;width:150px;height:190px;border-radius:20px;overflow:hidden;scroll-snap-align:start;border:1px solid rgba(255,255,255,.08);padding:0;text-align:left;color:var(--text);background:#14181b}
.qcard .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.qcard .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,13,15,0) 35%,rgba(10,13,15,.92))}
.qcard .qt{position:absolute;left:12px;right:46px;bottom:12px}
.qcard .qt b{display:block;font-size:14.5px;font-weight:700;line-height:1.2}
.qcard .qt small{display:block;font-size:11.5px;color:#c3cbcf;font-weight:600;margin-top:2px}
.qcard .go{position:absolute;right:10px;bottom:12px;width:30px;height:30px;border-radius:50%;background:var(--lime);color:var(--onlime);display:flex;align-items:center;justify-content:center}
.qcard .go .ic{width:16px;height:16px}
.qcard .tag{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:rgba(10,13,15,.6);color:var(--lime);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.last{display:flex;gap:12px;align-items:center;padding:12px;width:100%;text-align:left;color:var(--text);border:1px solid rgba(255,255,255,.07)}
.stage{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:5;margin:0 -18px 14px;height:min(42vh,400px);min-height:250px;
  background:radial-gradient(90% 70% at 50% 30%,#1f272b 0%,#12171a 60%,#0a0d0f 100%);border-radius:0 0 32px 32px;overflow:hidden;
  box-shadow:0 20px 40px -24px rgba(0,0,0,.9),inset 0 -1px 0 rgba(255,255,255,.05)}
.stage::before{content:"";position:absolute;left:50%;top:40%;width:70%;height:55%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(198,244,50,.10);filter:blur(40px);pointer-events:none}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 38px);
  -webkit-mask:linear-gradient(180deg,transparent,#000 60%);mask:linear-gradient(180deg,transparent,#000 60%)}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#0a0d0f}
.stage .shade{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(10,13,15,.6) 0%,rgba(10,13,15,0) 28%,rgba(10,13,15,0) 62%,rgba(10,13,15,.8) 100%)}
.stage .vmsg{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 18px;border-radius:20px;font-size:13.5px;font-weight:600;text-align:center;white-space:nowrap}
.stage .vmsg[hidden]{display:none}
.stage .ov{position:absolute;z-index:2;display:flex;gap:8px;align-items:center}
.stage .tl{top:12px;left:14px;right:14px;justify-content:flex-end}
.stage .bl{bottom:12px;left:14px;right:14px;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--text);text-decoration:none;border:0}
.pill .ic{width:15px;height:15px;color:var(--lime)}
.pill.lime{background:var(--lime);color:var(--onlime)}
.pill.lime .ic{color:var(--onlime)}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
.mchip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#c9d1d5}
.mchip.p{background:rgba(198,244,50,.12);color:var(--lime);border-color:rgba(198,244,50,.3)}
.howto{padding:14px 16px;margin-bottom:14px}
.howto ol{list-style:none;margin:6px 0 0;padding:0}
.howto li{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:14.5px;line-height:1.5;color:#c3cbcf}
.howto .num{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--onlime);background:var(--lime)}
.howto .tipbox{display:flex;gap:8px;margin-top:8px;padding:10px 12px;border-radius:14px;background:rgba(198,244,50,.08);border:1px solid rgba(198,244,50,.18);font-size:13.5px;color:#dff7a0;font-weight:600}
.howto .tipbox .ic{width:16px;height:16px;color:var(--lime);margin-top:1px}
@media (prefers-reduced-motion:reduce){.view,.bars3d .b{animation:none}.toast,.seg .lens,.tilt{transition:none}}
</style>

function sortedWeights(){return [...db.weights].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function upsertWeight(date,kg){const i=db.weights.findIndex(w=>w.date===date);if(i>=0)db.weights[i].kg=kg;else db.weights.push({date,kg});save()}
function lastSets(name){for(let i=db.sessions.length-1;i>=0;i--){const s=db.sessions[i].sets[name];if(s&&s.length)return s}return null}
function calcKcal(min,bw,effort,fin){const met=(EFFORT.find(e=>e.k===effort)||EFFORT[1]).met;const fm=fin?Math.min(6,min):0;return Math.round((met-1)*bw*(min-fm)/60+(FIN_MET-1)*bw*fm/60)}
function dayMuscles(k){const p=new Set(),s=new Set();for(const e of PROGRAM[k].ex){EX[e[0]].p.forEach(m=>p.add(m));EX[e[0]].s.forEach(m=>s.add(m))}p.forEach(m=>s.delete(m));return {p:[...p],s:[...s]}}

/* plate solver: fewest plates per side for each reachable load */
const PLATE_MAP=(()=>{const map=new Map();
  function go(i,sum,list){
    if(i===PLATES_PER_SIDE.length){const k=Math.round(sum*10)/10,cur=map.get(k);if(!cur||list.length<cur.length)map.set(k,list);return}
    const [p,c]=PLATES_PER_SIDE[i];
    for(let n=0;n<=c;n++)go(i+1,sum+p*n,list.concat(Array(n).fill(p)));
  }
  go(0,0,[]);return map})();
function solvePlates(total,bar){
  const side=Math.round((total-bar)/2*10)/10;
  if(side<0) return {err:`Below the ${fmt(bar)} kg bar`};
  if(PLATE_MAP.has(side)) return {plates:PLATE_MAP.get(side),side};
  let best=null;for(const k of PLATE_MAP.keys()) if(k<=side&&(best==null||k>best)) best=k;
  return {plates:PLATE_MAP.get(best)||[],side:best,closest:bar+best*2};
}
const chip=p=>`<span class="pl" style="background:${PLATE_COLOR[p]}">${fmt(p)}</span>`;
function platesHTML(name,w){
  const eq=EX[name].eq;if(eq==='db'||w==null) return '';
  const bar=eq==='ez'?db.settings.ez:db.settings.bar;
  const r=solvePlates(w,bar);
  if(r.err) return `<span>${esc(r.err)}</span>`;
  if(!r.plates.length) return `<span>Empty bar</span>`;
  return `<span>Each side</span>${r.plates.map(chip).join('')}${r.closest!=null?`<span>closest you can load: ${fmt(r.closest)} kg</span>`:''}`;
}

/* ---------- Rest timer ---------- */
let rest=null;// {end,total,done}
function startRest(sec){rest={end:Date.now()+sec*1000,total:sec,done:false};tickClock()}
$('#rest').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!rest)return;if(b.dataset.rest==='skip'){rest=null}else{rest.end+=30000;rest.total+=30;rest.done=false}tickClock()});
function tickClock(){
  const c=$('#clock');
  if(c&&db.active)c.textContent=mmss((Date.now()-db.active.start)/1000);
  const r=$('#rest');
  if(!rest){r.classList.remove('on','go');return}
  const left=(rest.end-Date.now())/1000;
  r.classList.add('on');
  if(left<=0){
    if(!rest.done){rest.done=true;beep();setTimeout(()=>{if(rest&&rest.done){rest=null;tickClock()}},4000)}
    r.classList.add('go');r.querySelector('.rt').textContent='Go';r.querySelector('.rl').textContent='Next set';r.querySelector('.rbar').style.width='100%';
  }else{
    r.classList.remove('go');r.querySelector('.rt').textContent=mmss(left);r.querySelector('.rl').textContent='Rest';

}

/* ---------- Navigation ---------- */
let tab='home',curEx=null,progEx=null,exMode='w';
/* Navigation uses the browser history, so Back/Forward (and Android's back button) move between screens */
const TABS=['home','workout','weight','progress','history','more'];
let navIdx=0,navMax=0;
const navHash=(t,ex)=>'#'+t+(ex?'/'+encodeURIComponent(ex):'');
function go(t,ex=null,replace=false){

  tab=t;curEx=ex;if(!replace){navIdx++;navMax=navIdx}
  try{history[replace?'replaceState':'pushState']({tab:t,ex,i:navIdx,max:navMax},'',navHash(t,ex))}catch(e){}
  render();window.scrollTo(0,0);
}
window.addEventListener('popstate',e=>{const st=e.state||{tab:'home',ex:null,i:0};tab=TABS.includes(st.tab)?st.tab:'home';curEx=st.ex||null;navIdx=st.i||0;navMax=Math.max(navMax,st.max||0);render();window.scrollTo(0,0)});

$('#navBack').addEventListener('click',()=>{if(navIdx>0)history.back()});

function tilt(el){

      </div></div></div>
    ${seg([['w','Weight'],['r','Reps'],['e','Est. 1RM']],exMode,'mode')}
    <div class="chart glass"><svg id="exChart" viewBox="0 0 320 170" role="img" aria-label="${esc(name)} progress"></svg></div>
    <div class="label">Previous sessions</div>
    ${hist.length?hist.slice().reverse().slice(0,5).map((s,k)=>{const x=s.sets[name],d=toDate(s.date);
      return `<div class="sess glass"><div class="date"><b>${d.getDate()}</b>${d.toLocaleDateString(undefined,{month:'short'})}</div>
      <div class="tbl" style="grid-template-columns:36px repeat(${x.length},minmax(40px,1fr))"><span>kg</span>${x.map(q=>`<b class="${best&&q.w===best.w&&q.r===best.r?'pr':''}">${fmt(q.w)}</b>`).join('')}<span>reps</span>${x.map(q=>`<b>${q.r}</b>`).join('')}</div></div>`}).join(''):'<p class="empty">Your sessions for this exercise will show here.</p>'}
  </section>`;
  drawExChart();
  setupVideo();
}
function drawExChart(){
  const hist=exHistory(curEx);
  const vals=hist.map(s=>{const x=s.sets[curEx];return exMode==='w'?Math.max(...x.map(q=>q.w)):exMode==='r'?x.reduce((a,q)=>a+q.r,0):Math.round(Math.max(...x.map(q=>e1rm(q.w,q.r)))*10)/10});
  smoothChart($('#exChart'),vals,hist.map(s=>shortDate(s.date)),{empty:'Log this exercise twice to see the line.'});
}
function startSession(k){
  const p=PROGRAM[k];
  db.active={day:k,start:Date.now(),finisher:false,effort:'hard',sets:Object.fromEntries(p.ex.map(e=>[e[0],Array.from({length:e[1]},()=>({w:null,r:null,done:false}))]))};
  save();curEx=null;if(tab!=='workout')go('workout');else{render();window.scrollTo(0,0)}
}
function tickSet(btn){
  const row=btn.closest('.srow'),card=btn.closest('[data-ex]'),name=card.dataset.ex,j=+row.dataset.set;
  const s=db.active.sets[name][j];
  if(s.done){s.done=false;row.classList.remove('ok');save();return}
  const [wi,ri]=row.querySelectorAll('input');
  if(s.w==null&&parseNum(wi.placeholder)!=null){s.w=parseNum(wi.placeholder);wi.value=fmt(s.w)}
  if(s.r==null&&/^\d+$/.test(ri.placeholder)){s.r=+ri.placeholder;ri.value=s.r}
  if(s.w==null||s.r==null){toast('Enter the weight and reps first');(s.w==null?wi:ri).focus();return}
  s.done=true;row.classList.add('ok');save();
  card.querySelector('.plates').innerHTML=platesHTML(name,s.w);
  startRest(EX[name].type==='c'?db.settings.restC:db.settings.restI);
  if(db.active.sets[name].every(x=>x.done))toast('Exercise done. Nice work.');
}
function finish(){
  const a=db.active,done={};let n=0;
  for(const [ex,sets] of Object.entries(a.sets)){const d=sets.filter(s=>s.done&&s.w!=null&&s.r!=null).map(s=>({w:s.w,r:s.r}));if(d.length){done[ex]=d;n+=d.length}}
  if(!n&&!confirm('No sets are ticked. Save anyway?'))return;
  let bw=(sortedWeights().slice(-1)[0]||{}).kg;
  if(!bw){bw=parseNum(prompt('Enter your body weight in kg. It is needed for the calorie estimate.')||'');if(!bw)return;upsertWeight(dstr(),bw)}
  const end=Date.now();let min=Math.max(1,Math.round((end-a.start)/60000));
  if(min>120){const v=parseNum(prompt(`This workout has been open for ${min} minutes. How many minutes did you actually train?`,'60')||'');if(!v)return;min=Math.round(v)}
  const kcal=calcKcal(min,bw,a.effort,a.finisher);
  db.sessions.push({id:end,date:dstr(new Date(a.start)),day:a.day,start:a.start,end,min,effort:a.effort,finisher:a.finisher,bw,kcal,sets:done});
  db.active=null;rest=null;save();go('workout',null,true);
  toast(`Saved: ${min} min, about ${kcal} kcal`);
}

/* ---------- Weight ---------- */
function rWeight(m){
  const ws=sortedWeights(),cur=ws[ws.length-1],today=ws.find(w=>w.date===dstr());
  const avg=a=>a.length?a.reduce((s,x)=>s+x.kg,0)/a.length:null;
  const a7=avg(ws.filter(w=>w.date>daysAgo(7))),p7=avg(ws.filter(w=>w.date>daysAgo(14)&&w.date<=daysAgo(7)));
  const diff=a7!=null&&p7!=null?a7-p7:null;
  const rev=ws.slice().reverse().slice(0,90);
  m.innerHTML=`<section>
  <div class="eyebrow">Weigh in each morning, after the bathroom and before eating</div>
  <h1>Body weight</h1>
  <div class="logw glass"><input id="wIn" inputmode="decimal" aria-label="Today's weight in kg" placeholder="${cur?fmt(cur.kg):'kg'}" value="${today?fmt(today.kg):''}"><span class="kg">kg</span><button class="gold" id="wSave">${today?'Update today':'Log today'}</button></div>
  <div class="tiles">${tileH(cur?fmt(cur.kg):'—','latest kg','','scale')}${tileH(a7!=null?a7.toFixed(1):'—','7-day average','','activity')}${tileH(diff!=null?signed(diff):'—','vs the week before',diff==null?'':diff<0?'good':diff>0?'bad':'','calendar-days')}</div>
  <div class="chart glass"><div class="ctitle">${ws.length>1?`${signed(cur.kg-ws[0].kg)} kg since ${shortDate(ws[0].date)}`:'Trend'}</div>
    <svg id="wChart" viewBox="0 0 320 170" role="img" aria-label="Body weight trend"></svg>
    <div class="legend2"><span><i style="background:#4a535a"></i>Daily</span><span><i style="background:#c6f432"></i>7-day average, the real trend</span></div></div>
  <div class="label">Entries</div>
  <div class="glass listcard">${rev.length?rev.map((w,i)=>{const nx=rev[i+1],c=nx?w.kg-nx.kg:0;
    return `<div class="li"><span>${toDate(w.date).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}</span><span class="chg ${c<0?'good':c>0?'bad':''}">${nx?signed(c):''}</span><b>${fmt(w.kg)} kg</b><button class="x" data-delw="${w.date}" aria-label="Delete entry">${ico('x')}</button></div>`}).join(''):'<p class="empty">Log your first weight above.</p>'}</div>
  </section>`;
  const pts=ws.slice(-90);
  const ma=pts.map(p=>{const from=toDate(p.date);from.setDate(from.getDate()-6);const f=dstr(from);return avg(pts.filter(x=>x.date>=f&&x.date<=p.date))});
  smoothChart($('#wChart'),pts.map(p=>p.kg),pts.map(p=>shortDate(p.date)),{overlay:ma,empty:'Log at least 2 days to see your trend.'});
}

/* ---------- Progress ---------- */
function rProgress(m){
  const names=Object.keys(EX).filter(n=>db.sessions.some(s=>s.sets[n]));
  if(!progEx||!names.includes(progEx))progEx=names[0]||null;
  const ws=weekStart(),weeks=[];
  for(let i=7;i>=0;i--){const s=new Date(ws);s.setDate(s.getDate()-7*i);const e=new Date(s);e.setDate(e.getDate()+7);
    weeks.push({label:s.toLocaleDateString(undefined,{day:'numeric',month:'short'}),v:db.sessions.filter(x=>x.start>=s&&x.start<e).reduce((a,b)=>a+b.kcal,0)})}
  const max=Math.max(...weeks.map(w=>w.v));
  const total=db.sessions.reduce((a,b)=>a+b.kcal,0);
  const prs=Object.keys(EX).map(n=>{let best=null,heavy=0;for(const s of db.sessions)for(const x of s.sets[n]||[]){const v=e1rm(x.w,x.r);if(!best||v>best.v)best={...x,v,date:s.date};heavy=Math.max(heavy,x.w)}return best&&{n,best,heavy}}).filter(Boolean);
  // muscles trained this week: main muscles of exercises done = hard, helpers = light
  const hard=new Set(),light=new Set();
  db.sessions.filter(s=>s.start>=ws.getTime()).forEach(s=>Object.keys(s.sets).forEach(n=>{if(!EX[n])return;EX[n].p.forEach(x=>hard.add(x));EX[n].s.forEach(x=>light.add(x))}));
  hard.forEach(x=>light.delete(x));
  m.innerHTML=`<section>
  <div class="eyebrow">Your training at a glance</div>
  <h1>Progress</h1>
  <div class="tiles">${tileH(db.sessions.length,'workouts logged','','dumbbell')}${tileH(total.toLocaleString(),'kcal burned in total','','flame')}${tileH(prs.length,'exercises tracked','','trophy')}</div>
  <div class="perspective"><div class="mapcard glass tilt">
    <div class="figs">${pair([...hard],[...light],60)}</div>
    <div class="legend"><div class="ctitle" style="margin:0 0 8px">Muscles this week</div>
      <div><span class="sw p"></span>Main focus</div><div><span class="sw s"></span>Helped out</div><div><span class="sw n"></span>Not trained yet</div>
      <div class="stat">${hard.size?`${hard.size} muscle group${hard.size===1?'':'s'} hit since Monday.`:'Finish a workout this week to light this up.'}</div></div></div></div>
  <div class="chart glass"><div class="ctitle">Calories burned per week</div>
    ${max?`<div class="bars3d">${weeks.map((w,i)=>`<div class="bw"><span class="bv">${w.v||''}</span><div class="b ${i===weeks.length-1?'now':''}" style="height:${Math.max(4,w.v/max*110)}px;animation-delay:${i*40}ms"></div><span class="bl">${i%2===1||i===weeks.length-1?w.label:''}</span></div>`).join('')}</div>`:'<p class="empty">Finish a workout to see calories here.</p>'}</div>
  <div class="chart glass"><div class="ctitle">Strength over time</div>
    ${names.length?`<select class="select" id="exSel" aria-label="Exercise">${names.map(n=>`<option ${n===progEx?'selected':''}>${esc(n)}</option>`).join('')}</select>`:''}
    <svg id="sChart" viewBox="0 0 320 170" role="img" aria-label="Estimated one-rep max over time"></svg>
    <div class="note" style="margin:4px 4px 4px">Estimated one-rep max from your best set each workout. A rising line means you're getting stronger.</div></div>
  <div class="label">Personal bests</div>
  <div class="glass listcard">${prs.length?prs.map(p=>`<div class="pr"><span class="medal">${ico('trophy')}</span><b>${esc(p.n)}</b><span class="v">${fmt(p.best.w)} × ${p.best.r}</span><small>Heaviest ${fmt(p.heavy)} kg · est. 1RM ${Math.round(p.best.v)} kg</small><small style="text-align:right">${shortDate(p.best.date)}</small></div>`).join(''):'<p class="empty">Finish your first workout to see personal bests.</p>'}</div>
  </section>`;
  const ses=progEx?db.sessions.filter(s=>s.sets[progEx]&&s.sets[progEx].length):[];
  smoothChart($('#sChart'),ses.map(s=>Math.round(Math.max(...s.sets[progEx].map(x=>e1rm(x.w,x.r)))*10)/10),ses.map(s=>shortDate(s.date)),{empty:'Log an exercise twice to see the line.'});
}

/* ---------- History ---------- */
function rHistory(m){
  const s=db.sessions.slice().reverse();
  m.innerHTML=`<section><div class="eyebrow">${s.length} workout${s.length===1?'':'s'} logged</div><h1>History</h1>`+(s.length?s.map(x=>{const p=PROGRAM[x.day]||{name:x.day};const nsets=Object.values(x.sets).reduce((a,b)=>a+b.length,0);const d=new Date(x.start);
    return `<details class="hs glass"><summary><div class="dchip"><b>${d.getDate()}</b>${d.toLocaleDateString(undefined,{weekday:'short'})}</div>
    <div class="t"><b>${esc(p.name)}</b><small>${d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})} · ${x.min} min · ${nsets} sets</small></div><div class="k">${x.kcal}<small>${ico('flame')}kcal</small></div></summary>
    <div class="sx">${Object.entries(x.sets).map(([n,ss])=>`<p>${esc(n)}<span>${ss.map(q=>`${fmt(q.w)} × ${q.r}`).join(', ')}</span></p>`).join('')}
    <p><span>Effort: ${(EFFORT.find(e=>e.k===x.effort)||{}).label||'—'} · Finisher ${x.finisher?'done':'skipped'} · Body weight used: ${fmt(x.bw)} kg</span></p>
    <button class="danger" data-dels="${x.id}">${ico('trash-2')}Delete workout</button></div></details>`}).join(''):'<p class="empty">No workouts yet. Start one from the Workout tab.</p>')+'</section>';
}

/* ---------- Settings ---------- */
function rMore(m){
  const st=db.settings,all=[];PLATES_PER_SIDE.forEach(([p,c])=>{for(let i=0;i<c;i++)all.push(p)});
  m.innerHTML=`<section>
  <div class="eyebrow">Aesthetic Body</div>
  <h1>Settings</h1>
  <div class="label">Equipment</div>
  <div class="glass listcard">
    <div class="field"><span>Barbell weight</span><span class="fin"><input inputmode="decimal" data-setting="bar" value="${fmt(st.bar)}" aria-label="Barbell weight in kg"><small>kg</small></span></div>
    <div class="field"><span>EZ bar weight</span><span class="fin"><input inputmode="decimal" data-setting="ez" value="${fmt(st.ez)}" aria-label="EZ bar weight in kg"><small>kg</small></span></div>
    <div class="fhelp">Weigh your bars once so the plate guide is right. Plates per side: ${all.map(chip).join('')}</div>
  </div>
  <div class="label">Rest timer</div>
  <div class="glass listcard">
    <div class="field"><span>Compound lifts</span><span class="fin"><input inputmode="numeric" data-setting="restC" value="${st.restC}" aria-label="Compound rest in seconds"><small>sec</small></span></div>
    <div class="field" style="border-bottom:0"><span>Isolation lifts</span><span class="fin"><input inputmode="numeric" data-setting="restI" value="${st.restI}" aria-label="Isolation rest in seconds"><small>sec</small></span></div>
  </div>
  <div class="label">How calories are estimated</div>
  <div class="glass listcard prose">
    <p>Lifting burns energy mostly through muscle effort and recovery, not the weight moved, so the app uses the standard research method: effort level × your body weight × workout time.</p>
    <p>Moderate counts as 2.5 kcal per kg per hour, Hard as 4, All-out as 5, and the 6-minute finisher as 7. These are active calories on top of what you'd burn sitting, roughly comparable to Apple Watch active calories.</p>
    <p>Treat it as a good estimate, not an exact figure.</p>
  </div>
  <div class="label">Your data</div>
  <div class="glass listcard">
    <p class="fhelp" style="margin:4px 0 2px">Everything stays on this phone. Export a backup every week or two so nothing is lost if you delete the app.</p>
    <div class="btn2"><button class="soft" id="exp">${ico('download')}Export backup</button><button class="soft" id="imp">${ico('upload')}Import backup</button></div>
    <input type="file" id="impFile" accept="application/json,.json" hidden>
    <button class="danger" id="reset">${ico('trash-2')}Erase all data</button>
  </div>
  </section>`;
}
async function exportData(){
  const name=`aesthetic-body-backup-${dstr()}.json`,blob=new Blob([JSON.stringify(db)],{type:'application/json'});
  if(window.AndroidApp&&AndroidApp.saveBackup){AndroidApp.saveBackup(name,JSON.stringify(db));return}// Android app wrapper
  try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Aesthetic Body backup'});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}

/* ---------- Charts (SVG, no libraries, works offline) ---------- */
function smoothChart(svg,vals,labels,o={}){
  if(!svg)return;
  if(vals.length<2){svg.innerHTML=`<text x="160" y="88" text-anchor="middle" font-size="13" fill="#6f797f" font-weight="600">${esc(o.empty||'Not enough data yet')}</text>`;return}
  const ov=o.overlay,all=vals.concat((ov||[]).filter(v=>v!=null));let lo=Math.min(...all),hi=Math.max(...all);
  const pad=Math.max((hi-lo)*.15,.5);lo-=pad;hi+=pad;
  const L=36,R=312,T=10,B=144,x=i=>L+(R-L)*i/(vals.length-1),y=v=>B-(B-T)*(v-lo)/(hi-lo);
  let g='';for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3,yy=y(v);g+=`<line x1="${L}" x2="${R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="rgba(255,255,255,.06)"/><text x="0" y="${(yy+4).toFixed(1)}" font-size="10.5" fill="#6f797f" font-weight="600">${v.toFixed(hi-lo<10?1:0)}</text>`}
  const path=a=>{let d='',st=false,pi=-1;a.forEach((v,i)=>{if(v==null)return;if(!st){d+=`M${x(i).toFixed(1)},${y(v).toFixed(1)}`;st=true}else{const xm=((x(pi)+x(i))/2).toFixed(1);d+=` C${xm},${y(a[pi]).toFixed(1)} ${xm},${y(v).toFixed(1)} ${x(i).toFixed(1)},${y(v).toFixed(1)}`}pi=i});return d};
  const main=ov||vals,d=path(main),li=main.length-1,lx=x(li),ly=y(main[li]);
  const dots=ov?vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.6" fill="#4a535a"/>`).join(''):vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.8" fill="#c6f432"/>`).join('');
  svg.innerHTML=`${g}<path d="${d} L${R},${B} L${L},${B}Z" fill="url(#gArea)"/>${dots}
    <path d="${d}" fill="none" stroke="#c6f432" stroke-width="3" stroke-linecap="round" style="filter:drop-shadow(0 0 6px rgba(198,244,50,.5))"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="9" fill="rgba(198,244,50,.2)"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="5" fill="#c6f432" stroke="#0a0d0f" stroke-width="2"/>
    <text x="${L}" y="164" font-size="10.5" fill="#6f797f" font-weight="600">${esc(labels[0])}</text><text x="${R}" y="164" font-size="10.5" fill="#6f797f" font-weight="600" text-anchor="end">${esc(labels[labels.length-1])}</text>`;
}

/* ---------- Events ---------- */
const main=$('#main');
main.addEventListener('click',e=>{
  unlockAudio();
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.start){if(db.active){toast('Finish or discard the current workout first');return}startSession(t.dataset.start);return}
  if(t.dataset.open){go('workout',t.dataset.open);return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.id==='demoToggle'){const v=$('#exVid');if(!v)return;if(v.paused)v.play().catch(()=>{});else v.pause();
    $('#demoIco').innerHTML=ico(v.paused?'play':'pause');$('#demoLbl').textContent=v.paused?'Play':'Pause';return}
  if(t.id==='vRetry'){const v=$('#exVid');$('#vMsg').hidden=true;v.load();v.play().catch(()=>{});return}
  if(t.hasAttribute('data-tick'))return tickSet(t);
  if(t.hasAttribute('data-add')){db.active.sets[curEx].push({w:null,r:null,done:false});save();render();return}
  if(t.dataset.mode){exMode=t.dataset.mode;const sg=t.parentNode,i=[...sg.querySelectorAll('button')].indexOf(t);sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));sg.querySelector('.lens').style.transform=`translateX(${i*100}%)`;drawExChart();return}
  if(t.dataset.effort){db.active.effort=t.dataset.effort;save();const sg=t.parentNode,i=[...sg.querySelectorAll('button')].indexOf(t);sg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===t));sg.querySelector('.lens').style.transform=`translateX(${i*100}%)`;return}
  if(t.id==='finish')return finish();
  if(t.id==='discard'){if(confirm('Discard this workout? Logged sets will be lost.')){db.active=null;rest=null;save();go('workout',null,true)}return}
  if(t.id==='wSave'){const v=parseNum($('#wIn').value);if(!v||v<20||v>350){toast('Enter your weight in kg, like 78.4');return}upsertWeight(dstr(),v);render();toast(`Logged ${fmt(v)} kg`);return}
  if(t.dataset.delw){if(confirm('Delete this weight entry?')){db.weights=db.weights.filter(w=>w.date!==t.dataset.delw);save();render()}return}
  if(t.dataset.dels){if(confirm('Delete this workout?')){db.sessions=db.sessions.filter(s=>String(s.id)!==t.dataset.dels);save();render()}return}
  if(t.id==='exp')return exportData();
  if(t.id==='imp')return $('#impFile').click();
  if(t.id==='reset'){if(confirm('Erase all workouts and weights? Export a backup first if you want to keep them.')&&confirm('This cannot be undone. Erase everything?')){db=blank();save();render();toast('All data erased')}return}
});
main.addEventListener('input',e=>{
  const i=e.target;
  if(i.dataset.f&&db.active){
    const card=i.closest('[data-ex]'),name=card.dataset.ex,j=+i.closest('.srow').dataset.set,s=db.active.sets[name][j];
    s[i.dataset.f]=i.dataset.f==='r'?(parseNum(i.value)==null?null:Math.round(parseNum(i.value))):parseNum(i.value);
    save();
    if(i.dataset.f==='w')card.querySelector('.plates').innerHTML=platesHTML(name,s.w);
  }
});
main.addEventListener('change',e=>{
  const i=e.target;
  if(i.id==='fin'){db.active.finisher=i.checked;save()}
  if(i.id==='exSel'){progEx=i.value;render()}
  if(i.dataset.setting){const k=i.dataset.setting,v=parseNum(i.value);if(v!=null&&v>=0){db.settings[k]=v;save();toast('Saved')}else i.value=db.settings[k]}
  if(i.id==='impFile'&&i.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.sessions))throw 0;if(confirm(`Replace current data with this backup (${d.sessions.length} workouts)?`)){d.settings=Object.assign(blank().settings,d.settings||{});d.weights=d.weights||[];db=d;save();render();toast('Backup restored')}}catch(err){toast('That file is not an Aesthetic Body backup')}};r.readAsText(i.files[0])}
});
main.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='wIn')$('#wSave').click()});

/* ---------- Auto-update: reload when a newer build is live ---------- */
let updChecked=0;
async function checkForUpdate(){
  if(!navigator.onLine||Date.now()-updChecked<60000)return;updChecked=Date.now();
  try{const t=await (await fetch('index.html?b='+Date.now(),{cache:'no-store'})).text();const m=t.match(/const APP_BUILD='([^']+)'/);
    if(m&&m[1]!==APP_BUILD){const busy=document.activeElement&&document.activeElement.tagName==='INPUT';if(!busy)location.reload();else updChecked=0}}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkForUpdate()});
window.addEventListener('online',checkForUpdate);
setTimeout(checkForUpdate,3000);

(()=>{const [t,ex]=location.hash.slice(1).split('/');if(TABS.includes(t)){tab=t;curEx=ex?decodeURIComponent(ex):null}
  try{history.replaceState({tab,ex:curEx,i:0,max:0},'',navHash(tab,curEx))}catch(e){}})();
render();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
